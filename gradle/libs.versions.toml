[versions]
# Core Ecosystem
kotlin                  = "2.3.21"
agp                     = "8.13.2"
ksp                     = "2.3.6"

# AndroidX & Compose
androidx-core           = "1.15.0"
androidx-lifecycle      = "2.10.0"
androidx-activity       = "1.13.0"
androidx-metrics        = "1.0.0"
compose-bom             = "2026.04.01"

# Libraries
retrofit                = "3.0.0"
moshi                   = "1.15.2"
gson                    = "2.14.0"
ghost                   = "1.1.17"
coil                    = "3.4.0"
ktor                    = "3.4.3"
ktorfit                 = "2.7.3"
ktor-moshi              = "4.0.0"
kotlinx-serialization   = "1.11.0"

[libraries]
# AndroidX Core & Lifecycle
androidx-core-ktx            = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose    = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-metrics             = { group = "androidx.metrics", name = "metrics-performance", version.ref = "androidx-metrics" }

# Compose BOM & UI
compose-bom                  = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }

# Serialization & Networking
retrofit                     = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi               = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
retrofit-gson                = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
moshi-kotlin                 = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
gson                         = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Ktor & Ktorfit
ktor-client-core             = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp           = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-negotiation      = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx   = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-moshi-community         = { group = "com.hypercubetools", name = "ktor-moshi", version.ref = "ktor-moshi" }
ktor-client-mock             = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktorfit-lib                  = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-lib", version.ref = "ktorfit" }
ktorfit-ksp                  = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-ksp", version.ref = "ktorfit" }

# Networking & Images
coil-compose                 = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp          = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

[bundles]
androidx-essential           = ["androidx-core-ktx", "androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel", "androidx-activity-compose"]
compose-ui                   = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3"]
retrofit-moshi               = ["retrofit", "retrofit-moshi", "moshi-kotlin"]
ktor-moshi                   = ["ktor-client-core", "ktor-client-negotiation", "ktor-moshi-community", "moshi-kotlin"]

[plugins]
android-application          = { id = "com.android.application", version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                          = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler             = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktorfit                      = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
ghost                        = { id = "com.ghostserializer.ghost", version.ref = "ghost" }
